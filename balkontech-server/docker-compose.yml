version: "3.9"

services:
  balkontech-tracker:
    build: .
    image: balkontech-tracker:latest
    container_name: balkontech-tracker

    # Bind only to localhost — the service is not exposed on the network.
    # The PyQt6 desktop client connects via http://127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./models:/app/models          # YOLO detector + ReID model .pt files
      - ./zones:/app/zones            # zone JSON files per video source
      - ./videos:/app/videos          # local video files for snapshot / playback
      - ./api_keys.json:/app/api_keys.json  # persisted API key store

    environment:
      - MODELS_DIR=/app/models
      - ZONES_DIR=/app/zones
      - API_KEYS_FILE=/app/api_keys.json

    restart: unless-stopped

    # ── GPU support (optional) ─────────────────────────────────────────────
    # Requires the NVIDIA Container Toolkit on the host.
    # The service auto-detects GPU at session creation via torch.cuda.is_available().
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
